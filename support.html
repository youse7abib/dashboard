<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Support</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<style>
    .menu ul li .uactive {
        background-color: #ffffff55;
    }
</style>

<body>
    <div class="menu">

        <ul>
            <li class="profile">
                <div class="img_box">
                    <img src="yousefhabibphoto.jpg" alt="profile">
                </div>
                <h2>yousef habib</h2>
            </li>

            <li>
                <a href="newdashboard.html" class="active">
                    <i class="fas fa-home"></i>
                    <p>dashboard</p>
                </a>
            </li>

            <li>
                <a href="newclient.html" class="cactive">
                    <i class="fas fa-user-group"></i>
                    <p>clients</p>
                </a>
            </li>

            <li>
                <a href="newproducts.html" class="pactive">
                    <i class="fas fa-table"></i>
                    <p>products</p>
                </a>
            </li>
            <li>
                <a href="newpost.html" class="tactive">
                    <i class="fas fa-pen"></i>
                    <p>Posts</p>
                </a>
            </li>

            <li>
                <a href="support.html" class="uactive">
                    <i class="fas fa-info-circle"></i>
                    <p>Support</p>
                </a>
            </li>

            <li>
                <a href="setting.html" class="sactive">
                    <i class="fas fa-cog"></i>
                    <p>settings</p>
                </a>
            </li>

            <li class="log-out">
                <a href="login.html">
                    <i class="fas fa-sign-out"></i>
                    <p>Log Out</p>
                </a>
            </li>

        </ul>

    </div>

    <div class="content">
        <div class="title-info">
            <p>Support Team</p>
            <i class="fas fa-info-circle"></i>
        </div>

        <div class="support-form">
            <form action="https://formspree.io/f/xwpovlje" method="POST">
                <h2>Contact US</h2>
                <div class="input-form">
                    <label for="name">Name:</label>
                    <input type="text" placeholder="Your name" name="Name:">
                </div>
                <div class="input-form">
                    <label for="email">E-mail:</label>
                    <input type="email" placeholder="Your E-mail" name="E-mail:">
                </div>
                <div class="input-form">
                    <label for="message">Message</label>
                    <textarea name="Message:" id="message" placeholder="Your Message"></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>

        if (localStorage.getItem("auth") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <script src="index.js"></script>
</body>


</html>
