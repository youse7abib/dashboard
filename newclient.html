<html>

</head>

</head>

<style>
    .menu ul li .cactive {
        background-color: #ffffff55;
    }
</style>

<body>
    <div class="menu">

        <ul>
            <li class="profile">
                <div class="img_box">
                    <img src="profile.webp" alt="profile">
                </div>
                <h2>yousef habib</h2>
            </li>

            <li>
                <a href="newdashboard.html" class="active">
                    <i class="fas fa-home"></i>
                    <p>dashboard</p>
                </a>
            </li>

            <li>
                <a href="newclient.html" class="cactive">
                    <i class="fas fa-user-group"></i>
                    <p>clients</p>
                </a>
            </li>

            <li>
                <a href="newproducts.html" class="pactive">
                    <i class="fas fa-table"></i>
                    <p>products</p>
                </a>
            </li>


            <li>
                <a href="newpost.html" class="tactive">
                    <i class="fas fa-pen"></i>
                    <p>Posts</p>
                </a>
            </li>

            <li>
                <a href="support.html" class="uactive">
                    <i class="fas fa-info-circle"></i>
                    <p>Support</p>
                </a>
            </li>

            <li>
                <a href="setting.html" class="sactive">
                    <i class="fas fa-cog"></i>
                    <p>settings</p>
                </a>
            </li>

            <li class="log-out">
                <a href="login.html">
                    <i class="fas fa-sign-out"></i>
                    <p>Log Out</p>
                </a>
            </li>

        </ul>

    </div>


    <div class="content">

        <div class="title-info">
            <p>Clients Data</p>
            <i class="fas fa-user"></i>
        </div>


        <div class="client">


            <div class="inputs">
                <input type="text" placeholder="Name" id="name">
                <input type="email" placeholder="E-mail" id="email">
                <input type="number" placeholder="Mobile Number" id="mobile">
                <button id="send">Create</button>
            </div>

            <div class="outputs">
                <div class="searchBlock">

                    <input type="text" onkeyup="searchdata(this.value)" id="seearch" placeholder="search ">
                    <div class="btnSearch">
                        <button onclick="getSearchMoode(this.id)" id="searchName">Search By Name</button>
                        <button onclick="getSearchMoode(this.id)" id="searchemail">Search By E-mail</button>
                    </div>
                </div>

                <div id="deleteAllClient">

                </div>
                <table>
                    <tr>
                        <th>Name</th>
                        <th>E-mail</th>
                        <th>Mobile</th>
                        <th>update</th>
                        <th>delete</th>

                    </tr>

                    <tbody id="tclientbody">

                    </tbody>

                </table>

            </div>


        </div>

    </div>



    
   <script>
        if (localStorage.getItem("auth") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <script src="index.js"></script>
    <script src="client.js"></script>
