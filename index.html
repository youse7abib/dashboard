<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom right, #051c36, #34617F, #5F8FA5, #051c36);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            background-color: #123;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 350px;
        }

        .login-form h2 {
            color: whitesmoke;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: #ccc;
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #34617F;
            color: #fff;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border: 1px solid #7b61ff;
            background-color: #051c36;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: black;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-form button:hover {
            background-color: rgba(116, 0, 225, 0.312);
        }
    </style>
</head>

<body>
    <form class="login-form" id="login-form">
        <h2>Dashboard LogIn</h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required />
        </div>
        <div class="form-group">
            <label for="password"> password</label>
            <input type="password" id="password" required />
        </div>
        <button type="submit">Log In</button>
    </form>

    <script>
        document.getElementById("login-form").addEventListener("submit", function (e) {
            e.preventDefault();


            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "admin" && password === "admin") {
                localStorage.setItem("auth", "true");
                window.location.href = "newdashboard.html";
            } else {
                alert("Please enter valid credentials.");
                alert("username : admin  |  password : admin");
            }
        });


    </script>

</body>

</html>
